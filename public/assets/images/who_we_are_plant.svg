<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="55%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aec6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#aec6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5c6d0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c5c6d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky2)"/>
  <circle cx="1250" cy="260" r="260" fill="url(#glow2)"/>

  <!-- ground haze -->
  <rect y="760" width="1600" height="240" fill="#05070b"/>

  <!-- pipe network -->
  <g stroke="#05070b" stroke-width="10" fill="none">
    <path d="M0,700 L1600,700"/>
    <path d="M200,700 L200,620 L520,620"/>
    <path d="M900,700 L900,640 L1240,640"/>
    <path d="M600,700 L600,660 L760,660"/>
  </g>
  <g fill="#89d6b8" opacity="0.6">
    <circle cx="200" cy="620" r="5"/><circle cx="520" cy="620" r="5"/>
    <circle cx="900" cy="640" r="5"/><circle cx="1240" cy="640" r="5"/>
  </g>

  <!-- refinery towers / silhouette skyline -->
  <g fill="#05070b">
    <rect x="120" y="480" width="60" height="290"/>
    <rect x="230" y="560" width="40" height="210"/>
    <rect x="320" y="420" width="70" height="350"/>
    <rect x="430" y="600" width="30" height="170"/>
    <rect x="500" y="500" width="50" height="270"/>
    <!-- storage tanks -->
    <rect x="600" y="640" width="120" height="130" rx="4"/>
    <ellipse cx="660" cy="640" rx="60" ry="12"/>
    <rect x="750" y="660" width="100" height="110" rx="4"/>
    <ellipse cx="800" cy="660" rx="50" ry="10"/>
    <!-- crane -->
    <path d="M900,780 L900,440 L1080,440 L1080,460" stroke="#05070b" stroke-width="10" fill="none"/>
    <path d="M900,500 L960,540" stroke="#05070b" stroke-width="8"/>
    <!-- tall stacks with smoke -->
    <rect x="1150" y="380" width="34" height="400"/>
    <rect x="1230" y="330" width="34" height="450"/>
    <rect x="1310" y="420" width="34" height="360"/>
    <ellipse cx="1167" cy="360" rx="70" ry="40" fill="url(#smoke)"/>
    <ellipse cx="1247" cy="300" rx="90" ry="50" fill="url(#smoke)"/>
    <ellipse cx="1327" cy="395" rx="60" ry="35" fill="url(#smoke)"/>
  </g>

  <!-- warning / status lights -->
  <g fill="#f2b96b" opacity="0.9">
    <circle cx="150" cy="480" r="3"/><circle cx="335" cy="420" r="3"/><circle cx="1167" cy="382" r="3"/>
  </g>
  <g fill="#89d6b8">
    <circle cx="620" cy="650" r="2.6"/><circle cx="770" cy="670" r="2.6"/><circle cx="1247" cy="335" r="2.6"/>
  </g>

  <!-- ground line -->
  <rect y="778" width="1600" height="4" fill="#0d1420"/>

  <!-- grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0,100 L1600,100"/><path d="M0,200 L1600,200"/><path d="M0,300 L1600,300"/>
    <path d="M0,400 L1600,400"/><path d="M0,900 L1600,900"/>
  </g>
</svg>
