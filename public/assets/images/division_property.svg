<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="50%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#2c2340"/>
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b96b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f2b96b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky6)"/>
  <circle cx="1200" cy="640" r="260" fill="url(#glow6)"/>

  <g fill="#cfe0ff" opacity="0.4">
    <circle cx="150" cy="100" r="1.4"/><circle cx="380" cy="60" r="1.2"/><circle cx="620" cy="140" r="1.4"/>
    <circle cx="900" cy="80" r="1.3"/><circle cx="1450" cy="140" r="1.4"/>
  </g>

  <!-- skyline silhouette -->
  <g fill="#05070b">
    <rect x="60" y="560" width="110" height="240"/>
    <rect x="190" y="480" width="90" height="320"/>
    <rect x="300" y="620" width="70" height="180"/>
    <rect x="390" y="400" width="130" height="400"/>
    <rect x="540" y="540" width="80" height="260"/>
    <rect x="640" y="460" width="100" height="340"/>
    <rect x="760" y="580" width="60" height="220"/>
    <rect x="840" y="360" width="150" height="440"/>
    <rect x="1010" y="500" width="90" height="300"/>
    <rect x="1120" y="600" width="70" height="200"/>
    <rect x="1210" y="440" width="120" height="360"/>
    <rect x="1350" y="560" width="90" height="240"/>
    <rect x="1460" y="500" width="100" height="300"/>
  </g>

  <!-- lit windows grid -->
  <g fill="#f2b96b" opacity="0.55">
    <circle cx="415" cy="440" r="3"/><circle cx="455" cy="440" r="3"/><circle cx="415" cy="480" r="3"/>
    <circle cx="865" cy="400" r="3"/><circle cx="905" cy="400" r="3"/><circle cx="945" cy="440" r="3"/>
    <circle cx="865" cy="480" r="3"/><circle cx="1240" cy="480" r="3"/><circle cx="1280" cy="520" r="3"/>
  </g>
  <g fill="#89d6b8" opacity="0.5">
    <circle cx="215" cy="520" r="3"/><circle cx="660" cy="500" r="3"/><circle cx="1030" cy="540" r="3"/>
  </g>

  <!-- construction crane on one tower -->
  <g stroke="#05070b" stroke-width="8" fill="none">
    <path d="M905,360 L905,220 L1030,220"/>
    <path d="M905,260 L960,300"/>
  </g>
  <g fill="#f2b96b">
    <circle cx="1030" cy="220" r="4"/>
  </g>

  <!-- ground -->
  <rect y="796" width="1600" height="204" fill="#05070b"/>
  <g stroke="#89d6b8" stroke-opacity="0.15" stroke-width="2">
    <line x1="0" y1="796" x2="1600" y2="796"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0,150 L1600,150"/><path d="M0,350 L1600,350"/><path d="M0,650 L1600,650"/>
  </g>
</svg>
