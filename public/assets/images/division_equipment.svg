<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e15"/>
      <stop offset="55%" stop-color="#18202f"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89d6b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#89d6b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg5)"/>
  <circle cx="820" cy="480" r="360" fill="url(#glow5)"/>

  <!-- hex bolt texture -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <polygon points="100,60 130,45 160,60 160,90 130,105 100,90"/>
    <polygon points="1400,120 1430,105 1460,120 1460,150 1430,165 1400,150"/>
    <polygon points="1300,820 1330,805 1360,820 1360,850 1330,865 1300,850"/>
    <polygon points="180,880 210,865 240,880 240,910 210,925 180,910"/>
  </g>

  <!-- large interlocking gears -->
  <g transform="translate(650,460)" fill="none" stroke="#05070b" stroke-width="28">
    <circle r="150"/>
  </g>
  <g transform="translate(650,460)" fill="#05070b">
    <circle r="40"/>
    <g id="teeth1">
      <rect x="-16" y="-190" width="32" height="50"/>
      <rect x="-16" y="140" width="32" height="50"/>
      <rect x="-190" y="-16" width="50" height="32"/>
      <rect x="140" y="-16" width="50" height="32"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-16" y="-190" width="32" height="50"/>
      <rect x="-16" y="140" width="32" height="50"/>
      <rect x="-190" y="-16" width="50" height="32"/>
      <rect x="140" y="-16" width="50" height="32"/>
    </g>
  </g>

  <g transform="translate(920,610)" fill="none" stroke="#0e1c2c" stroke-width="20">
    <circle r="95"/>
  </g>
  <g transform="translate(920,610)" fill="#0e1c2c">
    <circle r="26"/>
    <rect x="-11" y="-125" width="22" height="34"/>
    <rect x="-11" y="91" width="22" height="34"/>
    <rect x="-125" y="-11" width="34" height="22"/>
    <rect x="91" y="-11" width="34" height="22"/>
    <g transform="rotate(45)">
      <rect x="-11" y="-125" width="22" height="34"/>
      <rect x="-11" y="91" width="22" height="34"/>
      <rect x="-125" y="-11" width="34" height="22"/>
      <rect x="91" y="-11" width="34" height="22"/>
    </g>
  </g>

  <!-- wrench crossing -->
  <g transform="translate(1150,300) rotate(35)" fill="#05070b">
    <rect x="-14" y="-160" width="28" height="300" rx="10"/>
    <circle cx="0" cy="-170" r="42" fill="none" stroke="#05070b" stroke-width="20"/>
    <rect x="-30" y="140" width="60" height="34" rx="8"/>
  </g>

  <!-- safety helmet silhouette -->
  <g transform="translate(1250,700)" fill="#05070b">
    <path d="M-110,10 A110,90 0 0 1 110,10 L110,40 L-110,40 Z"/>
    <rect x="-130" y="34" width="260" height="20" rx="8"/>
    <rect x="-8" y="-70" width="16" height="70"/>
  </g>
  <g fill="#f2b96b" opacity="0.85">
    <circle cx="1250" cy="700" r="4"/>
  </g>
  <g fill="#89d6b8" opacity="0.75">
    <circle cx="650" cy="460" r="4"/><circle cx="920" cy="610" r="3.4"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0,150 L1600,150"/><path d="M0,450 L1600,450"/><path d="M0,750 L1600,750"/>
  </g>
</svg>
