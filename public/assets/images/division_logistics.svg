<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c13"/>
      <stop offset="55%" stop-color="#151f33"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aec6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#aec6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky4)"/>
  <circle cx="1300" cy="220" r="240" fill="url(#glow4)"/>

  <!-- road perspective -->
  <g stroke="#89d6b8" stroke-opacity="0.16" stroke-width="3" fill="none">
    <path d="M-100,1000 L700,600 L900,600 L1700,1000"/>
  </g>
  <g stroke="#f2b96b" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="26 22">
    <path d="M800,1000 L800,600"/>
  </g>
  <rect y="600" width="1600" height="400" fill="#05070b" opacity="0.4"/>

  <!-- shipping containers stacked -->
  <g fill="#05070b">
    <rect x="120" y="560" width="220" height="90" rx="4"/>
    <rect x="120" y="470" width="220" height="90" rx="4"/>
    <rect x="360" y="600" width="200" height="90" rx="4"/>
    <rect x="580" y="540" width="180" height="90" rx="4"/>
    <rect x="580" y="450" width="180" height="90" rx="4"/>
  </g>
  <g stroke="#1a2230" stroke-width="3">
    <line x1="120" y1="605" x2="340" y2="605"/>
    <line x1="120" y1="515" x2="340" y2="515"/>
    <line x1="360" y1="645" x2="560" y2="645"/>
    <line x1="580" y1="585" x2="760" y2="585"/>
    <line x1="580" y1="495" x2="760" y2="495"/>
  </g>
  <g fill="#89d6b8" opacity="0.7">
    <circle cx="150" cy="500" r="3"/><circle cx="600" cy="470" r="3"/><circle cx="400" cy="620" r="3"/>
  </g>

  <!-- haulage truck silhouette -->
  <g transform="translate(1020,560)" fill="#05070b">
    <rect x="0" y="-40" width="300" height="90" rx="6"/>
    <path d="M300,-40 L380,-40 L420,10 L420,50 L300,50 Z"/>
    <rect x="330" y="-10" width="60" height="36" rx="4" fill="#0e1c2c"/>
    <circle cx="60" cy="60" r="26"/>
    <circle cx="150" cy="60" r="26"/>
    <circle cx="360" cy="60" r="26"/>
    <circle cx="60" cy="60" r="9" fill="#1a2230"/>
    <circle cx="150" cy="60" r="9" fill="#1a2230"/>
    <circle cx="360" cy="60" r="9" fill="#1a2230"/>
  </g>
  <g fill="#f2b96b">
    <circle cx="1440" cy="590" r="4"/>
  </g>

  <!-- route pin -->
  <g transform="translate(1360,320)">
    <path d="M0,0 C-30,-30 -30,-70 0,-90 C30,-70 30,-30 0,0 Z" fill="#89d6b8" opacity="0.85"/>
    <circle cx="0" cy="-58" r="12" fill="#0b0f16"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0,100 L1600,100"/><path d="M0,250 L1600,250"/><path d="M0,400 L1600,400"/>
  </g>
</svg>
