<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a10"/>
      <stop offset="45%" stop-color="#122036"/>
      <stop offset="100%" stop-color="#0c1420"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1e30"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89d6b8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#89d6b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="330" r="220" fill="url(#glow)"/>
  <circle cx="1180" cy="330" r="46" fill="#dfe9ff" opacity="0.85"/>

  <!-- distant stars -->
  <g fill="#cfe0ff" opacity="0.5">
    <circle cx="120" cy="90" r="1.6"/><circle cx="260" cy="150" r="1.2"/><circle cx="420" cy="70" r="1.4"/>
    <circle cx="700" cy="120" r="1.3"/><circle cx="950" cy="60" r="1.5"/><circle cx="1400" cy="100" r="1.2"/>
    <circle cx="1500" cy="200" r="1.4"/><circle cx="80" cy="240" r="1.1"/>
  </g>

  <rect y="560" width="1600" height="440" fill="url(#sea)"/>

  <!-- waves -->
  <g stroke="#89d6b8" stroke-opacity="0.18" fill="none" stroke-width="2">
    <path d="M0,600 Q400,580 800,600 T1600,600"/>
    <path d="M0,650 Q400,625 800,650 T1600,650"/>
    <path d="M0,710 Q400,680 800,710 T1600,710"/>
  </g>
  <g stroke="#aec6ff" stroke-opacity="0.14" fill="none" stroke-width="2">
    <path d="M0,780 Q400,745 800,780 T1600,780"/>
    <path d="M0,860 Q400,820 800,860 T1600,860"/>
    <path d="M0,940 Q400,900 800,940 T1600,940"/>
  </g>

  <!-- offshore platform silhouette -->
  <g fill="#05070b">
    <rect x="700" y="330" width="14" height="240" />
    <rect x="880" y="330" width="14" height="240" />
    <rect x="660" y="560" width="280" height="26" rx="3"/>
    <rect x="690" y="586" width="220" height="14"/>
    <!-- legs into water -->
    <path d="M690,600 L640,860 L668,860 L710,600 Z"/>
    <path d="M910,600 L960,860 L932,860 L890,600 Z"/>
    <path d="M760,600 L735,860 L763,860 L780,600 Z"/>
    <path d="M840,600 L865,860 L837,860 L820,600 Z"/>
    <!-- derrick tower -->
    <path d="M770,170 L830,170 L860,330 L740,330 Z" fill="none" stroke="#05070b" stroke-width="10"/>
    <path d="M775,220 L825,220 M770,270 L830,270" stroke="#05070b" stroke-width="8"/>
    <!-- flare boom -->
    <path d="M894,340 L980,300" stroke="#05070b" stroke-width="8"/>
    <circle cx="985" cy="295" r="10" fill="#f2b96b" opacity="0.9"/>
    <circle cx="985" cy="295" r="26" fill="#f2b96b" opacity="0.25"/>
  </g>

  <!-- deck lights -->
  <g fill="#89d6b8">
    <circle cx="705" cy="573" r="2.4"/><circle cx="740" cy="573" r="2.4"/><circle cx="775" cy="573" r="2.4"/>
    <circle cx="820" cy="573" r="2.4"/><circle cx="860" cy="573" r="2.4"/><circle cx="895" cy="573" r="2.4"/>
  </g>

  <!-- grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0,0 L1600,0" /><path d="M0,100 L1600,100"/><path d="M0,200 L1600,200"/>
    <path d="M0,300 L1600,300"/><path d="M0,400 L1600,400"/><path d="M0,500 L1600,500"/>
    <path d="M0,700 L1600,700"/><path d="M0,800 L1600,800"/><path d="M0,900 L1600,900"/>
  </g>
</svg>
