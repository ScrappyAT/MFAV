<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89d6b8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#89d6b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky3)"/>

  <g fill="#cfe0ff" opacity="0.55">
    <circle cx="150" cy="120" r="1.6"/><circle cx="340" cy="200" r="1.2"/><circle cx="520" cy="90" r="1.4"/>
    <circle cx="760" cy="150" r="1.3"/><circle cx="1000" cy="80" r="1.5"/><circle cx="1250" cy="180" r="1.2"/>
    <circle cx="1450" cy="120" r="1.4"/><circle cx="90" cy="260" r="1.1"/><circle cx="1500" cy="300" r="1.2"/>
  </g>

  <!-- radar rings -->
  <g stroke="#aec6ff" stroke-opacity="0.22" fill="none" stroke-width="2">
    <circle cx="420" cy="720" r="90"/>
    <circle cx="420" cy="720" r="150"/>
    <circle cx="420" cy="720" r="210"/>
    <circle cx="420" cy="720" r="270"/>
  </g>
  <line x1="420" y1="720" x2="420" y2="450" stroke="#aec6ff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- flight path arcs -->
  <g stroke="#89d6b8" stroke-opacity="0.4" fill="none" stroke-width="2" stroke-dasharray="10 10">
    <path d="M60,780 Q700,300 1540,560"/>
    <path d="M120,500 Q650,650 1500,260"/>
  </g>

  <circle cx="1150" cy="330" r="200" fill="url(#glow3)"/>

  <!-- aircraft silhouette -->
  <g transform="translate(1000,360) rotate(-18)" fill="#05070b">
    <path d="M0,0 L260,10 L300,20 L260,30 L0,26 L-40,55 L-70,55 L-40,22 L-140,18 L-180,40 L-205,40 L-175,14 L-40,4 Z"/>
    <path d="M40,4 L60,-40 L75,-40 L65,6 Z"/>
    <path d="M40,24 L60,66 L75,66 L65,22 Z"/>
  </g>
  <g fill="#89d6b8" opacity="0.7">
    <circle cx="1300" cy="378" r="3"/>
  </g>

  <!-- helicopter silhouette -->
  <g transform="translate(280,300)" fill="#05070b">
    <ellipse cx="0" cy="20" rx="60" ry="20"/>
    <rect x="-95" y="14" width="40" height="6"/>
    <rect x="-3" y="-4" width="6" height="24"/>
    <line x1="-70" y1="-4" x2="70" y2="4" stroke="#05070b" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- distant cloud layer -->
  <g fill="#0d1420" opacity="0.8">
    <ellipse cx="200" cy="880" rx="260" ry="60"/>
    <ellipse cx="700" cy="920" rx="340" ry="70"/>
    <ellipse cx="1250" cy="880" rx="300" ry="65"/>
  </g>
  <rect y="900" width="1600" height="100" fill="#05070b"/>

  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0,100 L1600,100"/><path d="M0,300 L1600,300"/><path d="M0,500 L1600,500"/><path d="M0,700 L1600,700"/>
  </g>
</svg>
